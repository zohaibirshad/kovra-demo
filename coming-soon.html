<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Preloader (hidden automatically without JavaScript) -->
  <div class="preloader" aria-hidden="true">
    <div class="preloader__brand"><span>Kovra<span class="text-accent">.</span></span></div>
    <div class="preloader__count">0</div>
    <div class="preloader__bar"></div>
  </div>

  <!-- Custom cursor (desktop only) -->
  <div class="cursor" aria-hidden="true">
    <div class="cursor__ring"><span class="cursor__text"></span></div>
    <div class="cursor__dot"></div>
  </div>


  <main id="main">

    <div class="coming-soon">
      <div class="d-flex justify-content-between align-items-center">
        <a class="logo" href="index.html" aria-label="Kovra home">Kovra<span>.</span></a>
        <button class="btn-icon theme-toggle" type="button" data-theme-toggle aria-label="Switch color mode"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
      <section class="coming-soon__center" aria-labelledby="cs-title">
        <span class="eyebrow" data-anim="fade-up">Something new is on the way</span>
        <h1 class="display-xl m-0" id="cs-title" data-split="hero">Coming <span class="text-outline">soon</span></h1>
        <!-- Set a fixed launch date with data-date="2026-12-31T09:00:00" instead of data-days -->
        <ul class="countdown" data-countdown data-days="45" aria-label="Time until launch">
          <li><strong data-cd="days">00</strong><span>Days</span></li>
          <li><strong data-cd="hours">00</strong><span>Hours</span></li>
          <li><strong data-cd="minutes">00</strong><span>Minutes</span></li>
          <li><strong data-cd="seconds">00</strong><span>Seconds</span></li>
        </ul>
        <form class="form-kv cs-form" data-validate novalidate>
          <label class="form-label" for="cs-email">Get notified when we launch</label>
          <div class="newsletter"><input id="cs-email" name="email" type="email" placeholder="Your email address" autocomplete="email" required aria-describedby="cs-email-error"><button class="btn-kv btn-kv-sm" type="submit">Notify me</button></div>
          <div class="invalid-feedback" id="cs-email-error" data-error-for="cs-email"></div>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <div class="coming-soon__foot"><p>© <span data-year>2026</span> Kovra Studio</p><ul class="social-links" aria-label="Social media"><li><a href="#" aria-label="Instagram"><span aria-hidden="true">Ig</span></a></li><li><a href="#" aria-label="LinkedIn"><span aria-hidden="true">In</span></a></li><li><a href="#" aria-label="Dribbble"><span aria-hidden="true">Dr</span></a></li><li><a href="#" aria-label="Behance"><span aria-hidden="true">Be</span></a></li></ul></div>
    </div>
  </main>


  <button class="back-to-top" type="button" aria-label="Back to top" data-back-to-top>
    <svg class="progress" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/></svg>
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
  </button>

  <!-- Vendor JS (all local, see documentation > Credits) -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

  <script src="assets/vendor/lenis/lenis.min.js"></script>
  <!-- Theme JS -->
  <script src="assets/js/main.js"></script>
